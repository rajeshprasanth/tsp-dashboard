site_name: tsp-dashboard
site_description: A production-grade web dashboard for Task Spooler
repo_url: https://github.com/rajeshprashanth/tsp-dashboard
repo_name: rajeshprashanth/tsp-dashboard
edit_uri: blob/master/docs/

theme:
  name: material
  language: en
  logo: assets/images/logo-light.svg
  favicon: assets/images/logo-light.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rajeshprasanth/tsp-dashboard

copyright: Copyright &copy; 2026 tsp-dashboard contributors &mdash; GPL-3.0

nav:
  - Home: index.md
  - API reference: api.md
  - Development: development.md
  - Deployment: deployment.md